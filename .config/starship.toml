format = """
${custom.devbox}\
$username\
$hostname\
$shlvl\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$time\
$status\
$character"""

# Show an obvious badge only when we're on the devbox over SSH.
# Keys off the hostname + SSH session, so no per-machine env var is needed.
[custom.devbox]
when = 'test -n "$SSH_CONNECTION" && hostname | grep -qi devbox'
format = "[ 󰆧 DEVBOX ]($style) "
style = "bold fg:black bg:blue"

[hostname]
ssh_only = false
format = "[$hostname]($style) "

[username]
show_always = true
format = "[$user]($style)@"

[directory]
truncation_length = 10

[git_branch]
format = "[$symbol$branch]($style) "

[time]
disabled = false
format = "[$time]($style) "

